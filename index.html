<style>

h1{font-size:22px;margin:4px 0 14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sc2{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column}
.sc2 b{font-size:22px}.sc2 span{font-size:12px;opacity:.85}
.bota{background:var(--c1s);color:var(--c1)}.plat{background:var(--c2s);color:var(--c2)}
.sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 10px}
input{width:100%;padding:13px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--card);color:var(--tx);font:inherit}

.rc{color:var(--mut);font-size:13px;margin:4px 0 10px}
.rw{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;cursor:pointer}
.rl,.il{flex:1;min-width:0}

.b{padding:9px 14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;cursor:pointer;font:inherit}
.b.p{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.b.s{padding:5px 10px;font-size:13px}
.sh,.m{position:fixed;inset:0;background:#0007;display:none;z-index:15}

.sf{display:flex;gap:8px;margin-top:12px}.sf .b{flex:1}
.m{z-index:20;align-items:center;justify-content:center;padding:14px}.m.on{display:flex}
.md{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px}
.md label{font-size:12px;color:var(--mut)}
.thumb{width:84px;height:84px;border-radius:12px;object-fit:cover;background:var(--bg);border:1px solid var(--ln);flex-shrink:0;cursor:zoom-in}
.rw .thumb{width:84px;height:84px}
.fprev{display:flex;align-items:center;gap:10px;margin-top:2px}

.lb.on{display:flex}
.lb img{max-width:100%;max-height:calc(100% - 70px);object-fit:contain;border-radius:8px}
.lb span{color:#fff;font:700 15px ui-monospace,Menlo,monospace}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:13px;z-index:50;opacity:0;visibility:hidden;transition:transform .25s ease,opacity .25s ease,visibility .25s;box-shadow:0 10px 30px rgba(0,0,0,.25)}

<script>
// Formato: caixa|MODELO:tam x qtd,tam;MODELO:...   (sem "x" = 1 par)

5|CT35050002:39;CT04190088:38;CT34850003:36;CKJ5630004:37;CT00040002:42;CT34630002:35;CT04510003:40;CT35900002:33;CT35150001:42;CT04510001:34;CT04490002:40

10|CT00040003:37,44x2;CT30130004:34,35;CT04490001:35,39,43;CT00040001:42;CT04190093:33;CT28900001:37
11|CT00040004:44;CK13030001:33;CT32820001:40;CT28330001:38;CT31790001:35;CT31120001:34;CT31790002:36;CT30980001:34;CT31260001:37,38;CT00040007:44;CT00040008:44
12|CT04490001:36,39,43;CT04510005:35;CT29130001:36;CT28880002:35;CT27620002:35;CT19430002:38
13|CT28330001:34,35x2,37,39;CT08250002:39,44;CKJ4460002:33;CT17290001:40
14|CT23690001:37,41;CT00060003:45;CT00040008:36;CT17290001:35;CT28900001:37;CT04490001:35;CT32820002:36;CT33610001:37
15|CT04190086:33;CT04190090:36x2;CT30370003:33;CK13030001:37;CT04190081:36;CT19910004:38;CT00040003:44
16|CT29720001:36x4;CT04190003:35x2;CT04190088:39;CT19910004:38;CT00040003:44;CK15630006:33x2;156999C:?
17|CT26610002:33x3,34,36,38,39;CT28100002:38;CT19910009:36,37;CT31260001:36
18|CT04190081:36;CT00040001:42;CT00040003:37;CT04510010:35;CT04510001:33;CT04510005:33,34;CT04510003:34x2
19|CT04190080:34x4,35,39;CT31260001:34;CT04190081:33x2,36x2,37
20|CT04190084:36;CT28330003:34,38x2;CT31250001:40;CT04190078:34;CT04190079:33;CT26610001:36;CT00040001:40;CT26490001:33;CKJ4170001:33;CT04190070:35
21|CT28330001:39;CT00040003:38;CT32770002:38x2;CT32820001:35;CT00040001:37x2;157000C:33,33.5,35
22|CT08250001:33,38,41,42,43,44;CT32930001:34;CT32650003:38`;
const SEED_PLAT=`1|CT09830001:33,38;CT04950003:41x3;CT04950001:37;CT09630064:33;CT09820001:36;CT09820002:35;CT09830004:33
2|CT04940003:37x5,40x3
3|CT04950001:34,38;CT34900001:34;CT34900002:37;CT09830002:34,35,37,39;CT09830003:38;CT32790001:39
4|CT04950002:35x4,38,42;CT04950001:39;CT09830001:39;CT09820002:41;J66696C:33x2
5|166584C:33x8
6|CT32790001:33,34x2,36;CT09820001:37x2;CT04940003:33,34
7|CT04940001:33;CT12000055:37;CT04940003:34,38;166584C:34x3,37
8|CT33490002:38;CT04950001:33x2,42;CKJ5660003:34,35;CT04940002:38x2;CT04940004:33;CT04940003:35
9|CT26550001:36x2;CT30360001:33,36,37;CT29600002:34x5;CT32110002:34x2
10|CT32110002:34x2;CT25630002:36,39;CT22880001:38;CT28420002:37;CT28280001:33;CT32190001:36;CT25940001:37x2;CT28280002:39;CT04940003:33
11|CT04940003:35x3;CT09830002:35;CT09830003:35;CKJ5660003:34;CT09830001:33;166584C:37;166582C:39
13|CT28010001:36;CT25630001:35x2,36x3,37x3,38x2,39
14|CT09830001:36x2,38;CT28010002:36;CT31610001:37;CT25940001:36;CT04950001:36x4
15|CT04950001:34;166584C:33x2;CT09820002:36;CT04940003:33x3,34,40
16|CT33490002:38;CT09820002:37x2;CT09820001:37;166587C:41;166582C:33,34;CT04950001:36;CT04940003:41`;
const parse=s=>s.trim().split('\n').filter(Boolean).map(l=>{const[n,r]=l.split('|');return{n:+n,items:r.split(';').map(p=>{const[c,z]=p.split(':');return{c,z:z.split(',').map(x=>{const[t,q]=x.split('x');return{t,q:+q||1}})}})}});
const KEY='estoque-caixas-v1';
let D,tab='bota',byModel=false,qry='',edit=null;
const V=2,fresh=()=>({v:V,bota:parse(SEED_BOTA),plat:parse(SEED_PLAT)});
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D||!D.bota)D=fresh();
if((D.v||1)<V){const f=fresh();['bota','plat'].forEach(k=>{D[k]=D[k]||[];f[k].forEach(b=>{if(!D[k].some(x=>x.n==b.n))D[k].push(b)})});D.v=V;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hl=s=>{s=esc(s);if(!qry)return s;const i=s.toLowerCase().indexOf(qry);return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+qry.length)+'</mark>'+s.slice(i+qry.length)};
const pr=q=>q+(q>1?' pares':' par');
const zs=z=>z.map(x=>x.t+(x.q>1?'x'+x.q:'')).join(', ');
const pz=s=>s.split(/[,;]/).map(x=>x.trim()).filter(Boolean).map(x=>{const[t,q]=x.toLowerCase().split('x');return{t:t.trim(),q:+q||1}});
const pairs=b=>b.items.reduce((a,i)=>a+i.z.reduce((s,x)=>s+x.q,0),0);
const match=(i)=>!qry||i.c.toLowerCase().includes(qry)||i.z.some(x=>x.t.toLowerCase()===qry||x.t.toLowerCase().startsWith(qry)&&/^\d/.test(qry));

const NM={bota:'Bota Adulta',plat:'Plataforma'};
let cur=null,pendingImg=null,removeImg=false;

// Fotos ficam guardadas à parte, por código do modelo (compartilhadas entre
// caixas/categorias que tiverem o mesmo código), não dentro de cada item.
const PHOTOS_KEY='estoque-caixas-photos-v1'; // formato antigo (localStorage), só para migrar
const pk=c=>String(c||'').trim().toUpperCase();
// PH[codigo] = {t: miniatura, f: foto grande} (ou texto simples, no formato antigo)
let PH={};
const photoFor=c=>{const v=PH[pk(c)];return v&&(v.t||v)};
const photoFull=c=>{const v=PH[pk(c)];return v&&(v.f||v)};

let dbP;
function idb(){
 return dbP||(dbP=new Promise((res,rej)=>{
  const r=indexedDB.open('estoque-caixas-fotos',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('fotos');
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error);
 }));
}
const idbDo=(mode,fn)=>idb().then(db=>new Promise((res,rej)=>{
 const tx=db.transaction('fotos',mode),st=tx.objectStore('fotos');
 const out=fn(st);
 tx.oncomplete=()=>res(out&&out.result);
 tx.onerror=()=>rej(tx.error);
 tx.onabort=()=>rej(tx.error);
}));
async function putPhoto(c,v){
 c=pk(c);PH[c]=v;
 try{await idbDo('readwrite',st=>st.put(v,c))}catch(e){toast('Não consegui guardar a foto (sem espaço?).')}
}
async function delPhoto(c){
 c=pk(c);delete PH[c];
 try{await idbDo('readwrite',st=>st.delete(c))}catch(e){}
}
async function loadPhotos(){
 try{
  const db=await idb();
  await new Promise((res,rej)=>{
   const tx=db.transaction('fotos','readonly'),rq=tx.objectStore('fotos').openCursor();
   rq.onsuccess=()=>{const cu=rq.result;if(cu){PH[cu.key]=cu.value;cu.continue()}};
   tx.oncomplete=res;tx.onerror=()=>rej(tx.error);
  });
  // migra as fotos antigas que estavam no localStorage
  const old=JSON.parse(localStorage.getItem(PHOTOS_KEY)||'null');
  if(old&&typeof old=='object'){
   for(const c of Object.keys(old)){if(!PH[c])await putPhoto(c,{t:old[c],f:old[c]})}
   localStorage.removeItem(PHOTOS_KEY);
  }
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 }catch(e){}
}

function compressDataUrl(src,maxSize,q){
 return new Promise(resolve=>{
  if(!src){resolve(null);return}
  const img=new Image();
  img.onload=()=>{
   let w=img.width,h=img.height;
   if(w>h&&w>maxSize){h=h*maxSize/w;w=maxSize}else if(h>maxSize){w=w*maxSize/h;h=maxSize}
   const c=document.createElement('canvas');c.width=w;c.height=h;
   c.getContext('2d').drawImage(img,0,0,w,h);
   resolve(c.toDataURL('image/jpeg',q||0.88));
  };
  img.onerror=()=>resolve(null);
  img.src=src;
 });
}
async function makeBoth(src){
 const f=await compressDataUrl(src,1400,0.9);
 if(!f)return null;
 const t=await compressDataUrl(f,300,0.82);
 return {t:t||f,f};
}
function readFileAsDataURL(file){
 return new Promise((resolve,reject)=>{
  const fr=new FileReader();
  fr.onload=()=>resolve(fr.result);
  fr.onerror=reject;
  fr.readAsDataURL(file);
 });
}
let toastT;
function toast(msg){
 const el=$('toast');el.textContent=msg;el.classList.add('show');
 clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),3200);
}
const mz=i=>!qry||i.c.toLowerCase().includes(qry)?i.z:i.z.filter(x=>x.t.toLowerCase().startsWith(qry));
const chips=(z,h)=>z.map(x=>`<span class="chip">${h?hl(x.t):esc(x.t)} <i>· ${pr(x.q)}</i></span>`).join('');
const box=(n,t)=>D[t].find(b=>b.n==n);
function render(){
 $('sum').innerHTML=['bota','plat'].map(t=>`<div class="sc2 ${t}"><b>${pr(D[t].reduce((a,b)=>a+pairs(b),0))}</b><span>${NM[t]} · ${D[t].length} ${D[t].length==1?'caixa':'caixas'}</span></div>`).join('');
 let h='';
 if(qry){
  const R=[];['bota','plat'].forEach(t=>D[t].forEach(b=>b.items.forEach(i=>{const z=mz(i);if(z.length)R.push({t,n:b.n,c:i.c,z})})));
  R.sort((a,b)=>a.c.localeCompare(b.c)||a.n-b.n);
  const tot=R.reduce((a,r)=>a+r.z.reduce((s,x)=>s+x.q,0),0);
  h=R.length?`<div class="rc">${R.length} ${R.length>1?'resultados':'resultado'} · ${pr(tot)} no total</div>`+R.map(r=>`<div class="rw" data-a="open" data-t="${r.t}" data-n="${r.n}">${photoFor(r.c)?`<img class="thumb" data-a="zoom" data-c="${esc(r.c)}" src="${photoFor(r.c)}" alt="">`:''}<div class="rl"><span class="cd">${hl(r.c)}</span><div class="ch">${chips(r.z,1)}</div></div><span class="bd ${r.t}">${r.t=='bota'?'Bota':'Plataforma'} · Caixa ${r.n}</span></div>`).join(''):'<div class="emp">Nada encontrado.</div>';
 }else{
  ['bota','plat'].forEach(t=>{
   const L=D[t].slice().sort((a,b)=>a.n-b.n);
   h+=`<div class="gt">${NM[t]} <small>${L.length} ${L.length==1?'caixa':'caixas'}</small></div><div class="gd">`+L.map(b=>`<button class="tl ${t}" data-a="open" data-t="${t}" data-n="${b.n}"><span class="tn">${b.n}</span><span class="tq">${pr(pairs(b))}</span></button>`).join('')+`<button class="tl add" data-a="nb" data-t="${t}">＋</button></div>`;
  });
 }
 $('ls').innerHTML=h;
}
function sheet(){
 const b=cur&&box(cur.n,cur.t);
 if(!b){$('sh').classList.remove('on');cur=null;sync();return}
 const t=cur.t,n=cur.n,a=`data-t="${t}" data-n="${n}"`;
 $('scc').innerHTML=`<div class="sh1"><span class="nb ${t}">${n}</span><div><b>${NM[t]}</b><small>${pr(pairs(b))} · ${b.items.length} ${b.items.length==1?'modelo':'modelos'}</small></div><button class="b s" data-a="cl">Fechar</button></div>`+
 b.items.map((i,k)=>`<div class="it">${photoFor(i.c)?`<img class="thumb" data-a="zoom" data-c="${esc(i.c)}" src="${photoFor(i.c)}" alt="">`:''}<div class="il"><span class="cd">${esc(i.c)}</span><div class="ch">${chips(i.z)}</div></div><div class="ib"><button class="b s" data-a="ei" ${a} data-k="${k}">✎</button><button class="b s" data-a="di" ${a} data-k="${k}">✕</button></div></div>`).join('')+
 `<div class="sf"><button class="b p" data-a="ai" ${a}>＋ Modelo</button><button class="b" data-a="db" ${a}>Excluir caixa</button></div>`;
 $('sh').classList.add('on');sync();
}
function openM(title,n,c,z,lockN,t){
 edit={t};pendingImg=null;removeImg=false;
 $('mt').textContent=title+' ('+NM[t]+')';$('f1').value=n;$('f1').disabled=!!lockN;$('f2').value=c;$('f3').value=z;
 $('f4').value='';
 const existing=photoFor(c);
 if(existing){$('f4prev').src=existing;$('f4wrap').style.display='flex'}else{$('f4wrap').style.display='none'}
 $('m').classList.add('on');sync();
}
const closeM=()=>{$('m').classList.remove('on');edit=null;sync()};
$('cn').onclick=closeM;
$('f4').onchange=async e=>{
 const file=e.target.files[0];if(!file)return;
 const raw=await readFileAsDataURL(file);
 pendingImg=await makeBoth(raw);
 removeImg=false;
 $('f4prev').src=pendingImg.t;$('f4wrap').style.display='flex';
};
$('f4rm').onclick=()=>{pendingImg=null;removeImg=true;$('f4').value='';$('f4wrap').style.display='none'};
$('ok').onclick=()=>{
 const n=+$('f1').value,c=$('f2').value.trim().toUpperCase(),z=pz($('f3').value),t=edit.t;
 if(!n||!c||!z.length){alert('Preencha caixa, código e tamanhos.');return}
 let b=box(n,t);if(!b){b={n,items:[]};D[t].push(b)}
 const it={c,z};
 if(edit.k!=null)b.items[edit.k]=it;else b.items.push(it);
 if(removeImg)delPhoto(c);
 else if(pendingImg)putPhoto(c,pendingImg);
 save();closeM();cur={t,n};render();sheet();
};
function zoom(src,code){
 if(!src)return;
 $('lbi').src=src;$('lbc').textContent=code||'';$('lb').classList.add('on');sync();
}
const closeLb=()=>{$('lb').classList.remove('on');$('lbi').removeAttribute('src');sync()};

// Botão "voltar" do celular: cada camada aberta (foto, formulário, caixa) usa
// uma entrada no histórico, então voltar fecha só a camada de cima em vez de
// sair do app.
let pushed=false,ignorePop=0,syncT;
const anyOpen=()=>$('lb').classList.contains('on')||$('m').classList.contains('on')||$('sh').classList.contains('on');
function sync(){clearTimeout(syncT);syncT=setTimeout(()=>{
 const open=anyOpen();
 if(open&&!pushed){history.pushState({camada:1},'');pushed=true}
 else if(!open&&pushed){pushed=false;ignorePop++;history.back()}
},0)}
window.addEventListener('popstate',()=>{
 if(ignorePop>0){ignorePop--;return}
 pushed=false;
 if($('lb').classList.contains('on'))closeLb();
 else if($('m').classList.contains('on'))closeM();
 else if($('sh').classList.contains('on')){cur=null;sheet()}
 sync();
});
$('lb').onclick=closeLb;
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&$('lb').classList.contains('on'))closeLb()});
$('f4prev').onclick=()=>{const c=pk($('f2').value);zoom(pendingImg?pendingImg.f:photoFull(c),c)};
document.addEventListener('click',e=>{
 if(e.target.id=='sh'){cur=null;sheet();return}
 const x=e.target.closest('[data-a]');if(!x)return;
 const a=x.dataset.a,n=x.dataset.n,k=x.dataset.k,t=x.dataset.t;
 if(a=='zoom'){const c=x.dataset.c;zoom(photoFull(c),c);return}
 if(a=='open'){cur={t,n};sheet()}
 if(a=='cl'){cur=null;sheet()}
 if(a=='nb'){const mx=Math.max(0,...D[t].map(b=>b.n));openM('Nova caixa',mx+1,'','',false,t)}
 if(a=='ai')openM('Adicionar modelo — caixa '+n,n,'','',true,t);
 if(a=='ei'){const i=box(n,t).items[k];openM('Editar — caixa '+n,n,i.c,zs(i.z),true,t);edit.k=+k}
 if(a=='di'&&confirm('Remover este modelo da caixa '+n+'?')){box(n,t).items.splice(k,1);save();render();sheet()}
 if(a=='db'&&confirm('Excluir a caixa '+n+' inteira?')){D[t]=D[t].filter(b=>b.n!=n);save();cur=null;render();sheet()}
});
$('q').oninput=e=>{qry=e.target.value.trim().toLowerCase();render()};
$('rst').onclick=()=>{if(confirm('Apagar alterações e voltar aos dados originais?')){D=fresh();save();cur=null;render();sheet()}};
$('csv').onclick=()=>{
 const rows=[['Tipo','Caixa','Modelo','Tamanho','Pares']];
 ['bota','plat'].forEach(k=>D[k].forEach(b=>b.items.forEach(i=>i.z.forEach(x=>rows.push([NM[k],b.n,i.c,x.t,x.q])))));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.join(';')).join('\n')],{type:'text/csv'}));a.download='estoque.csv';a.click();
};
$('impBtn').onclick=()=>$('fotosFile').click();
$('fotosFile').onchange=async e=>{
 const file=e.target.files[0];if(!file)return;
 $('impBtn').textContent='Importando...';$('impBtn').disabled=true;
 try{
  const text=await file.text();
  const data=JSON.parse(text);
  // Aceita tanto a lista "catalog" (um registro por modelo) quanto "shoes"
  // (itens de estoque, pode ter o mesmo código repetido) — o catálogo tem
  // prioridade por já vir com uma foto por modelo.
  const list=[];
  if(Array.isArray(data.catalog))list.push(...data.catalog);
  if(Array.isArray(data.shoes))list.push(...data.shoes);
  if(Array.isArray(data))list.push(...data);
  let added=0;
  for(const item of list){
   if(!item||!item.codigo||!item.foto)continue;
   const code=String(item.codigo).trim().toUpperCase();
   // Mantém a foto do JSON exatamente como veio (sem recomprimir), só gera a miniatura.
   let src=item.foto;if(typeof src!='string')continue;
   if(!/^(data:|https?:)/.test(src))src='data:image/jpeg;base64,'+src;
   const th=await compressDataUrl(src,300,0.82);
   const big=th?{t:th,f:src}:null;
   const old=PH[code],oldLen=old?(old.f||old).length:0;
   if(big&&big.f.length>oldLen){await putPhoto(code,big);added++}
  }
  render();sheet();
  toast(added?`${added} foto(s) importada(s) ou melhorada(s)`:'Nenhuma foto nova encontrada nesse arquivo.');
 }catch(err){
  alert('Não consegui ler esse arquivo. Confira se é um JSON com campos "codigo" e "foto".');
 }
 $('impBtn').textContent='Importar fotos (JSON)';$('impBtn').disabled=false;
 e.target.value='';
};
render();
loadPhotos().then(()=>{render();sheet()});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
}
</script></body></html>
